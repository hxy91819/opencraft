version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /runtime/dsh
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /hemesclient
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
