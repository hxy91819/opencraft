name: build-matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web-browser, electron-renderer, electron-host, expo-web, expo-ios-bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run matrix:check
      - run: npm run matrix:build -- ${{ matrix.target }}

  macos-electron:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:identity
      - run: npm run prepare:dsh-runtime
      - run: npm run smoke:local-agent
      - run: npm run build:electron:release
      - run: npm exec --workspace @opencraft/workbench-electron -- electron-builder --mac dmg
      - uses: actions/upload-artifact@v4
        with:
          name: electron-macos-native
          path: apps/workbench-electron/release/OpenCraft-*
