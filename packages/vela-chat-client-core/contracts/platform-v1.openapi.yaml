          items: {$ref: '#/components/schemas/RuntimeDirectoryChannel'}
        members:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/RuntimeDirectoryMember'}
        directConversations:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/RuntimeDirectoryDirectConversation'}
        revision: {type: string, minLength: 1, maxLength: 512}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    RuntimeChannelMembers:
      type: object
      additionalProperties: false
      required: [channel, members, revision, expiresAt]
      properties:
        channel: {$ref: '#/components/schemas/RuntimeDirectoryChannel'}
        members:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/RuntimeDirectoryMember'}
        revision: {type: string, minLength: 1, maxLength: 512}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    ResolveRuntimeThreadRequest:
      type: object
      additionalProperties: false
      required: [channelId, rootMessageRef]
      properties:
        channelId: {$ref: '#/components/schemas/Id'}
        rootMessageRef: {$ref: '#/components/schemas/ThreadMessageRef'}
    RegisterRuntimeThreadReplyRequest:
      type: object
      additionalProperties: false
      required: [channelId, messageRef]
      properties:
        channelId: {$ref: '#/components/schemas/Id'}
        messageRef: {$ref: '#/components/schemas/ThreadMessageRef'}

    RuntimeReminderAnchor:
      type: object
      additionalProperties: false
      required: [kind, channelId]
      description: |
        message 锚点必须提供 messageRef 且不得提供 threadId/rootMessageRef；
        thread 锚点必须提供 threadId/rootMessageRef 且不得提供 messageRef。
      properties:
        kind: {type: string, enum: [message, thread]}
        channelId: {$ref: '#/components/schemas/Id'}
        threadId:
          allOf: [{$ref: '#/components/schemas/Id'}]
          nullable: true
        messageRef:
          allOf: [{$ref: '#/components/schemas/ThreadMessageRef'}]
          nullable: true
        rootMessageRef:
          allOf: [{$ref: '#/components/schemas/ThreadMessageRef'}]
          nullable: true
    RuntimeReminder:
      type: object
      additionalProperties: false
      required:
        [id, serverId, agentId, scheduleKind, schedule, timezone, text,
         status, revision, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        agentId: {$ref: '#/components/schemas/Id'}
        scheduleKind: {type: string, enum: [once, cron]}
        schedule: {type: string}
        timezone: {type: string}
        text: {type: string}
        status: {type: string, enum: [active, paused, completed, canceled]}
        nextFireAt: {$ref: '#/components/schemas/NullableTimestamp'}
        anchor:
          allOf: [{$ref: '#/components/schemas/RuntimeReminderAnchor'}]
          nullable: true
        revision: {$ref: '#/components/schemas/Revision'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    CreateRuntimeReminderRequest:
      type: object
      additionalProperties: false
      required: [scheduleKind, schedule, timezone, text]
      properties:
        scheduleKind: {type: string, enum: [once, cron]}
        schedule: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 100}
        text: {type: string, minLength: 1, maxLength: 5000}
        anchor:
          allOf: [{$ref: '#/components/schemas/RuntimeReminderAnchor'}]
          nullable: true
    UpdateRuntimeReminderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 100}
        text: {type: string, minLength: 1, maxLength: 5000}
        status: {type: string, enum: [active, paused]}
        anchor:
          allOf: [{$ref: '#/components/schemas/RuntimeReminderAnchor'}]
          nullable: true
    SnoozeRuntimeReminderRequest:
      type: object
      additionalProperties: false
      required: [delaySeconds]
      properties:
        delaySeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000

    Reminder:
      type: object
      additionalProperties: false
      required:
        [id, serverId, agentId, createdByMemberId, scheduleKind, schedule,
         timezone, text, status, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        agentId: {$ref: '#/components/schemas/Id'}
        createdByMemberId: {$ref: '#/components/schemas/Id'}
        scheduleKind: {type: string, enum: [once, cron]}
        schedule: {type: string}
        timezone: {type: string}
        text: {type: string}
        status: {type: string, enum: [active, paused, completed, canceled]}
        nextFireAt: {$ref: '#/components/schemas/NullableTimestamp'}
        revision: {$ref: '#/components/schemas/Revision'}
    CreateReminderRequest:
      type: object
      additionalProperties: false
      required: [agentId, scheduleKind, schedule, timezone, text]
      properties:
        agentId: {$ref: '#/components/schemas/Id'}
        scheduleKind: {type: string, enum: [once, cron]}
        schedule:
          type: string
          maxLength: 200
          description: once 使用未来 RFC3339；cron 使用标准五字段表达式，不含秒字段
        timezone: {type: string, maxLength: 100}
        text: {type: string, minLength: 1, maxLength: 5000}
    UpdateReminderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule: {type: string, maxLength: 200}
        timezone: {type: string, maxLength: 100}
        text: {type: string, minLength: 1, maxLength: 5000}
        status: {type: string, enum: [active, paused, canceled]}
    ReminderOccurrence:
      type: object
      additionalProperties: false
      required:
        [id, serverId, reminderId, agentId, scheduledFireAt, state, text]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        reminderId: {$ref: '#/components/schemas/Id'}
        agentId: {$ref: '#/components/schemas/Id'}
        scheduledFireAt: {$ref: '#/components/schemas/Timestamp'}
        state: {type: string, enum: [due, acknowledged, canceled]}
        text: {type: string}
        acknowledgedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        resultCode: {type: string, nullable: true}

    InboxItem:
      type: object
      additionalProperties: false
      required: [id, serverId, kind, title, status, resourceId, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        kind: {type: string, enum: [task]}
        title: {type: string}
        status:
          type: string
          enum: [todo, in_progress, in_review]
        resourceId: {$ref: '#/components/schemas/Id'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    ActivityItem:
      type: object
      additionalProperties: false
      required:
        [id, serverId, kind, resourceType, resourceId, summary, occurredAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          enum: [task.changed, reminder.changed]
        resourceType:
          type: string
          enum: [task, reminder]
        resourceId: {$ref: '#/components/schemas/Id'}
        summary: {type: string}
        occurredAt: {$ref: '#/components/schemas/Timestamp'}

    Operation:
      type: object
      additionalProperties: false
      required: [id, service, kind, state, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        service: {type: string, enum: [im, tat, platform]}
        kind: {type: string}
        state:
          type: string
          enum: [pending, running, retry_wait, succeeded, failed, uncertain, superseded]
          x-enum-varnames:
            [OperationStatePending, OperationStateRunning, OperationStateRetryWait,
             OperationStateSucceeded, OperationStateFailed,
             OperationStateUncertain, OperationStateSuperseded]
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        completedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        error:
          type: object
          nullable: true
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
