openapi: 3.0.3
info:
  title: Chatserver Platform API
  version: 5.0.0
  license:
    name: Proprietary
  description: |
    Human、Agent、Server、Computer、Task 和 Reminder 的产品控制面。

    普通聊天由 Human/Agent 直接连接腾讯云 IM；Computer 通过 Vela Assignment
    承载 Agent Runtime，并使用腾讯云 TAT 完成纳管与 PTY。本 API 不提供消息代理、
    Computer WebSocket 或任意远程 Shell。
servers:
  - url: /v1
tags:
  - name: Auth
    description: Human 账号注册、登录和会话轮换。
  - name: Me
    description: 当前 Human 账号与腾讯云 IM Session。
  - name: Servers
    description: Server 产品空间。
  - name: Members
    description: Human/Agent 成员与邀请。
  - name: Channels
    description: 腾讯云 Community/Topic 的平台映射。
  - name: DirectMessages
    description: Server 内双成员私信与腾讯云 Work 群映射；平台不保存消息正文。
  - name: Threads
    description: Thread 的腾讯消息引用索引；平台不保存消息正文。
  - name: Agents
    description: Agent 身份、配置和 Vela Assignment 生命周期。
  - name: Runtime
    description: Agent Runtime 的受限平台接口。
  - name: Computers
    description: TAT 原生实例、托管实例与 PTY。
  - name: Tasks
    description: Server 内 Task。
  - name: Reminders
    description: Reminder 与到期 occurrence。
  - name: Inbox
    description: 当前 Human Member 的待办工作投影。
  - name: Activity
    description: Server 内当前业务资源变化投影，不包含聊天或 Agent 运行轨迹。
  - name: Operations
    description: 脱敏的腾讯云异步操作状态。
  - name: Callbacks
    description: 腾讯云服务端回调；只由受信任的腾讯云控制面调用。
security:
  - HumanBearer: []
x-database-modes:
  sqlite:
    role: 单进程、单写者的单机生产模式
    implementationStatus: v1-first
  tdsql:
    role: 多实例水平扩展生产模式
    engine: TDSQL MySQL InnoDB distributed
    implementationStatus: v1-canary
x-tdsql-routing:
  appliesWhen: database mode is tdsql
  engine: TDSQL MySQL InnoDB distributed
  serverScopedPaths: serverId
  accountScopedPaths: authenticated accountId
  runtimeScopedPaths: serverId from verified Runtime Token
  registries:
    login: loginHash
    serverSlug: slug
    tatInstance: bindingHash
    agentIM: imUserId
    computerSetupCode: codeHash
  rule: 缺失可验证 shardkey 时不得退化为在线全分片搜索。
x-auth-domain-registry:
  callback: [observeTencentIMState]
  public: [register, login, refreshAuth, redeemComputerSetupCode]
  runtime:
    [getRuntimeMe, getRuntimeDirectory, getRuntimeDirectoryV2,
     getRuntimeChannelMembers,
     resolveRuntimeThread, registerRuntimeThreadReply, listRuntimeTasks,
     getRuntimeTask, updateRuntimeTaskStatus, claimRuntimeTask,
     listRuntimeReminders, createRuntimeReminder, updateRuntimeReminder,
     cancelRuntimeReminder, snoozeRuntimeReminder, listRuntimeReminderLog,
     listRuntimeReminderOccurrences, acknowledgeRuntimeReminderOccurrence]
  computer-credential: [createComputerSession, createComputerSessionV2, preflightComputer]
  computer-bearer:
    [rotateComputerCredential, getComputerAssignments, getComputerAssignmentsV2,
     getComputerAssignmentsV3, createComputerAgentLaunch, createComputerAgentLaunchV2,
     refreshComputerAgentSession, refreshComputerAgentSessionV2, putComputerAgentObservation,
     putComputerAgentProfileCapabilityResult,
     putComputerAgentProfileCapabilityInvalidation, sendComputerHeartbeat]
  enrollment: [claimComputerEnrollment, getComputerArtifact]
  human:
    [logout, getMe, createHumanImSession, listServers, createServer, getServer,
     updateServer, resolveServerSlug, listInvites, createInvite, revokeInvite,
     acceptInvite, acceptJoinLink, listMembers, getMember, updateMember, removeMember,
     listChannels, createChannel, getChannel, updateChannel, listChannelMembers,
     addChannelMember, removeChannelMember, ensureMessageThread, getMessageThread,
     listDirectConversations, createDirectConversation, getDirectConversation,
     retryDirectConversation,
     listMessageThreadReplies, registerMessageThreadReply, markMessageThreadRead,
     listAgents, createAgent, getAgent, updateAgent, deleteAgent,
     listAgentsV2, createAgentV2, getAgentV2, updateAgentV2, deleteAgentV2, deployAgent,
     startAgent, stopAgent, restartAgent, rotateAgentRuntimeCredential,
     getAgentProfileCapabilities, refreshAgentProfileCapabilities,
     listComputers, createComputer, getComputer, updateComputer, removeComputer,
     listComputerRuntimeCapabilities,
     getComputerInstallationOptions, getComputerInstallationTargets, createComputerSetupCommand,
     createComputerRuntimeCredential, refreshComputer, createTerminalSession,
     listTasks, createTask, getTask, updateTask, listReminders,
     createReminder, getReminder, updateReminder, cancelReminder, listInbox,
     listActivity, getOperation]
x-error-code-registry:
