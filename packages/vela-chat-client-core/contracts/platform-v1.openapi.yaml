paths:
  /callbacks/tencent-im/state:
    post:
      tags: [Callbacks]
      operationId: observeTencentIMState
      summary: 接收腾讯云 IM 登录状态回调
      description: |
        仅在配置独立 Callback Token 后启用。Sign 是
        sha256(Token + RequestTime)，回调不使用 Human 或 Runtime Bearer。
      security: []
      parameters:
        - {name: SdkAppid, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: CallbackCommand, in: query, required: true, schema: {type: string, enum: [State.StateChange]}}
        - {name: contenttype, in: query, required: true, schema: {type: string, enum: [json]}}
        - {name: RequestTime, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: Sign, in: query, required: true, schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TencentIMStateCallback'}
      responses:
        '200':
          description: 已接收；重复或乱序事实仍返回成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TencentIMCallbackResult'}
        '400': {description: 回调结构或命令无效}
        '401': {description: 回调签名、时间窗或 SDKAppID 无效}
        '500': {description: 在线事实暂时无法提交}

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: 注册成功
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Error'}

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Error'}

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuth
      summary: 轮换访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: 轮换成功
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        default: {$ref: '#/components/responses/Error'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前会话
      responses:
        '204': {description: 已退出}
        default: {$ref: '#/components/responses/Error'}

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 获取当前账号
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Error'}

  /me/im/session:
    post:
      tags: [Me]
      operationId: createHumanImSession
      summary: 签发 Human 的短期腾讯云 IM Session
      description: 不接受 serverId 或 userId；只为当前 Account.imUserId 签发。
      responses:
        '200':
          description: 一次性短期 IM Session
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImSession'}
        default: {$ref: '#/components/responses/Error'}

  /servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: 列出当前账号加入的 Server
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Server 列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Servers]
      operationId: createServer
      summary: 创建 Server 和腾讯云 IM Community
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateServerRequest'}
      responses:
        '201':
          description: 腾讯云 Community 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Server'}
        '202':
          description: 已提交异步创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Servers]
      operationId: getServer
      summary: 获取 Server
      responses:
        '200':
          description: Server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Server'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: 修改 Server
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateServerRequest'}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Server'}
        default: {$ref: '#/components/responses/Error'}

  /server-slugs/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
    get:
      tags: [Servers]
      operationId: resolveServerSlug
      summary: 按全局 slug 解析 Server
      description: 先点查 slug 分片 registry，再按 serverId 点查 Server。
      responses:
        '200':
          description: Server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Server'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/invites:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Members]
      operationId: listInvites
      summary: 列出邀请
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Invite'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Members]
      operationId: createInvite
      summary: 创建邀请
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInviteRequest'}
      responses:
        '201':
          description: 邀请创建成功，token 只返回一次
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteSecret'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/invites/{inviteId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/InviteId'}
    delete:
      tags: [Members]
      operationId: revokeInvite
      summary: 撤销邀请
      responses:
        '204': {description: 已撤销}
        default: {$ref: '#/components/responses/Error'}

  /invites/accept:
    post:
      tags: [Members]
      operationId: acceptInvite
      summary: 接受邀请
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 20}
      responses:
        '202':
          description: 已接受并开始同步 IM membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /join-links/accept:
    post:
      tags: [Members]
      operationId: acceptJoinLink
      summary: 幂等接受加入链接并返回确定的 Server 落点
      description: 已经是成员时仍返回当前 Member 与可访问的落地 Channel，不返回 already_member 错误。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptJoinLinkRequest'}
      responses:
        '200':
          description: 已加入或正在同步腾讯 IM membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinResult'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/members:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Members]
      operationId: listMembers
      summary: 列出成员
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/members/{memberId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/MemberId'}
    get:
      tags: [Members]
      operationId: getMember
      summary: 获取成员
      responses:
        '200':
          description: 成员
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Members]
      operationId: updateMember
      summary: 修改成员资料或角色
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMemberRequest'}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Members]
      operationId: removeMember
      summary: 移除成员
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已进入移除流程
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/direct-conversations:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [DirectMessages]
      operationId: listDirectConversations
      summary: 列出当前 Human 在本 Server 可访问的私信
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Server 内私信映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectConversationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [DirectMessages]
      operationId: createDirectConversation
      summary: 创建或取得 Server 内双成员私信
      description: active/ready 返回 200；首次创建或仍在 provisioning 返回 202。创建 key 不负责恢复 error 资源。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDirectConversationRequest'}
      responses:
        '200':
          description: 已存在且可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectConversation'}
        '202':
          description: 已开始腾讯 Work 群投影
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/direct-conversations/{directConversationId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/DirectConversationId'}
    get:
      tags: [DirectMessages]
      operationId: getDirectConversation
      summary: 获取 Server 内私信映射
      responses:
        '200':
          description: 私信映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectConversation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/direct-conversations/{directConversationId}/retry:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/DirectConversationId'}
    post:
      tags: [DirectMessages]
      operationId: retryDirectConversation
      summary: 人工恢复 error 或已关闭的 Server 内私信
      description: 每次恢复尝试使用新的 Idempotency-Key；同一恢复 key 始终重放同一 Operation。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已开始新的恢复 Operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Channels]
      operationId: listChannels
      summary: 列出 Channel
      responses:
        '200':
          description: Channel 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Channel'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Channels]
      operationId: createChannel
      summary: 创建 Channel/Topic
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateChannelRequest'}
      responses:
        '202':
          description: 已提交创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
    get:
      tags: [Channels]
      operationId: getChannel
      summary: 获取 Channel
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Channels]
      operationId: updateChannel
      summary: 修改 Channel 名称或描述
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChannelRequest'}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/members:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
    get:
      tags: [Channels]
      operationId: listChannelMembers
      summary: 列出 Channel 成员
      description: 系统 #全员返回 Server 全体 active Member；普通 Channel 返回显式 active Member，仅 Server 管理员或该 Channel 成员可读取。
      responses:
        '200':
          description: Channel 成员
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/members/{memberId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
      - {$ref: '#/components/parameters/MemberId'}
    put:
      tags: [Channels]
      operationId: addChannelMember
      summary: 加入 Channel
      description: Owner/Admin 可添加任意 Server Member；普通成员可把自己加入 Public Channel，也可重新同步自己已有的 active Private Channel membership。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交腾讯云 Topic membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Channels]
      operationId: removeChannelMember
      summary: 离开 Channel
      description: Owner/Admin 可移出成员；普通成员只能退出自己。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交移除
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/threads:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
    post:
      tags: [Threads]
      operationId: ensureMessageThread
      summary: 为腾讯根消息建立或取得 Thread
      description: 只保存可定位根消息的引用，不复制消息正文。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnsureMessageThreadRequest'}
      responses:
        '201':
          description: Thread 已存在或已建立
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThread'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/threads/{threadId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
      - {$ref: '#/components/parameters/ThreadId'}
    get:
      tags: [Threads]
      operationId: getMessageThread
      summary: 取得 Thread 引用与当前成员未读数
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThread'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/threads/{threadId}/replies:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
      - {$ref: '#/components/parameters/ThreadId'}
    get:
      tags: [Threads]
      operationId: listMessageThreadReplies
      summary: 分页列出 Thread 回复的腾讯消息引用
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 回复引用页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThreadReplyReferencePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Threads]
      operationId: registerMessageThreadReply
      summary: 登记一条已经由腾讯 IM 发出的 Thread 回复
      description: 调用顺序固定为先发送腾讯消息，再登记引用；本操作不会发送消息。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterMessageThreadReplyRequest'}
      responses:
        '201':
          description: 回复引用已登记
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThreadReplyReference'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/channels/{channelId}/threads/{threadId}/read:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ChannelId'}
      - {$ref: '#/components/parameters/ThreadId'}
    put:
      tags: [Threads]
      operationId: markMessageThreadRead
      summary: 推进当前成员的 Thread 已读位置
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarkMessageThreadReadRequest'}
      responses:
        '204': {description: 已读位置已推进或本来更新}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Agents]
      operationId: listAgents
      summary: 列出 Agent
      responses:
        '200':
          description: Agent 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Agents]
      operationId: createAgent
      summary: 创建普通 IM Agent 身份
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '202':
          description: 已创建业务对象并开始同步 IM
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    get:
      tags: [Agents]
      operationId: getAgent
      summary: 获取 Agent
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Error'}

    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: 修改 Agent
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: 墓碑 Agent、撤销 Runtime credential 并异步删除 IM 账号
      description: |
        删除只作用于目标 Agent。平台不会停止 Computer 级 TAT、Controller、PTY 或
        同一 Computer 上的其他 Agent；目标 Runtime 由下一版 Assignment Snapshot
        的集合差异退出。Agent workspace 与历史消息引用默认保留。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交删除
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents-v2:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Agents]
      operationId: listAgentsV2
      summary: 以可扩展 Runtime selector 列出 Agent
      responses:
        '200':
          description: Agent v2 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentV2'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Agents]
      operationId: createAgentV2
      summary: 使用可扩展 Runtime selector 创建 Agent
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequestV2'}
      responses:
        '202':
          description: 已创建业务对象并开始同步 IM
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents-v2/{agentId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    get:
      tags: [Agents]
      operationId: getAgentV2
      summary: 获取 Agent v2
      responses:
        '200':
          description: Agent v2
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentV2'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Agents]
      operationId: updateAgentV2
      summary: 修改 Agent v2
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequestV2'}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentV2'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Agents]
      operationId: deleteAgentV2
      summary: 删除 Agent v2
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交删除
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResource'}
        default: {$ref: '#/components/responses/Error'}
  /servers/{serverId}/agents/{agentId}/deploy:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: deployAgent
      summary: 将 Agent 部署目标写入 Vela Assignment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已接受 Assignment 操作
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/start:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: startAgent
      summary: 将 Agent 期望状态设为 running
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已接受 Assignment 操作
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/stop:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: stopAgent
      summary: 将 Agent 期望状态设为 stopped
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已接受 Assignment 操作
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/restart:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: restartAgent
      summary: 通过新配置代次重启 Agent
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已接受 Assignment 操作
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/credentials/rotate:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: rotateAgentRuntimeCredential
      summary: 轮换 Agent Runtime credential generation
      description: 新 generation 立即进入 Assignment；不通过 HTTP 返回长期明文凭证。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交轮换
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/profile-capabilities:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    get:
      tags: [Agents]
      operationId: getAgentProfileCapabilities
      summary: 读取 Agent Profile 最近一次运行能力快照
      description: 只允许 Server owner/admin；读取不会触发 Computer 探测或刷新。
      responses:
        '200':
          description: Agent Profile 能力
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentProfileCapabilities'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/agents/{agentId}/profile-capabilities/refresh:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Agents]
      operationId: refreshAgentProfileCapabilities
      summary: 显式刷新 Agent Profile 运行能力
      description: 只允许 Server owner/admin；创建异步 Operation，不等待 Computer 探测完成。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已创建或重放 Profile capability refresh Operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/me:
    get:
      tags: [Runtime]
      operationId: getRuntimeMe
      summary: 获取当前 Runtime 身份与配置
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: 当前 Runtime
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeIdentity'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/directory:
    get:
      tags: [Runtime, Servers]
      operationId: getRuntimeDirectory
      summary: 获取当前 Agent 有权发现的 Server 协作目录
      description: 返回 Server、当前 Agent、可见 Channel 与同 Server active 成员；不返回任何腾讯云凭据。
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: 当前 Runtime 的完整授权目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeDirectory'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/directory-v2:
    get:
      tags: [Runtime, Servers]
      operationId: getRuntimeDirectoryV2
      summary: 获取包含平台私信路由的当前 Agent 协作目录
      description: |
        返回 Server、当前 Agent、可见 Channel、同 Server active 成员，以及当前 Agent 参与的
        Direct Conversation 授权路由；不返回腾讯云凭据或消息正文。
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: 当前 Runtime 的完整 V2 授权目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeDirectoryV2'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/channels/{channelId}/members:
    parameters:
      - {$ref: '#/components/parameters/ChannelId'}
    get:
      tags: [Runtime, Channels]
      operationId: getRuntimeChannelMembers
      summary: 获取当前 Agent 有权查看的 Channel 成员
      description: |
        系统 #全员返回 Server 全体 active Member；普通 public/private Channel 都只返回显式 active 成员。
        public 只影响发现与自助加入，不隐式授予成员关系。调用者必须本身已加入该 Channel。
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: Channel 及其当前授权成员
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeChannelMembers'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/threads:resolve:
    post:
      tags: [Runtime, Threads]
      operationId: resolveRuntimeThread
      summary: 为当前 Agent 可访问的腾讯根消息建立或取得 Thread 引用
      description: 只登记腾讯 IM 路由和消息坐标，不保存消息正文，也不发送消息。
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveRuntimeThreadRequest'}
      responses:
        '200':
          description: 已存在或新建的稳定 Thread 引用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThread'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/threads/{threadId}/replies:
    parameters:
      - {$ref: '#/components/parameters/ThreadId'}
    post:
      tags: [Runtime, Threads]
      operationId: registerRuntimeThreadReply
      summary: 登记当前 Agent 已经通过腾讯 IM 发出的 Thread 回复
      description: |
        固定在腾讯 IM 发送成功后调用；本接口只登记消息引用，不发送或重试消息。
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRuntimeThreadReplyRequest'}
      responses:
        '201':
          description: 回复引用已登记
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThreadReplyReference'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/tasks:
    get:
      tags: [Runtime, Tasks]
      operationId: listRuntimeTasks
      summary: 列出当前 Agent 被指派的 Task
      security:
        - RuntimeBearer: []
      parameters:
        - name: updatedAfter
          in: query
          schema: {type: string, format: date-time}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 当前 Agent 的 Task 列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/tasks/{taskId}:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      tags: [Runtime, Tasks]
      operationId: getRuntimeTask
      summary: 获取当前 Agent 被指派的 Task
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Runtime, Tasks]
      operationId: updateRuntimeTaskStatus
      summary: 当前 Agent 更新自己 Task 的执行状态
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeTaskStatusRequest'}
      responses:
        '200':
          description: Task
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/tasks/{taskId}/claim:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    post:
      tags: [Runtime, Tasks]
      operationId: claimRuntimeTask
      summary: 当前 Agent 领取已经指派给自己的 Task
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Task；重复领取不增加 revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Computers]
      operationId: listComputers
      summary: 列出 Computer
      responses:
        '200':
          description: Computer 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Computer'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Computers]
      operationId: createComputer
      summary: 创建待接入的 Computer
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComputerRequest'}
      responses:
        '201':
          description: Computer 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Computer'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers/{computerId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ComputerId'}
    get:
      tags: [Computers]
      operationId: getComputer
      summary: 获取 Computer
      responses:
        '200':
          description: Computer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Computer'}
        default: {$ref: '#/components/responses/Error'}

    patch:
      tags: [Computers]
      operationId: updateComputer
      summary: 修改 Computer 名称
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: 已修改
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Computer'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Computers]
      operationId: removeComputer
      summary: 解除平台映射，不销毁真实实例
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: 已解除}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computer-runtime-capabilities:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Computers]
      operationId: listComputerRuntimeCapabilities
      summary: 列出 Computer 已协商的 Runtime 协议能力
      responses:
        '200':
          description: Computer Runtime 协议能力
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ComputerRuntimeCapability'}
        default: {$ref: '#/components/responses/Error'}
  /computer-installation-options:
    get:
      tags: [Computers]
      operationId: getComputerInstallationOptions
      summary: 获取当前可安装的 Computer 平台
      description: 只返回后台固定且已经签名的发布版本，不暴露 COS 或 TAT。
      responses:
        '200':
          description: 当前安装平台目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerInstallationOptions'}
        default: {$ref: '#/components/responses/Error'}

  /computer-installation-targets:
    get:
      tags: [Computers]
      operationId: getComputerInstallationTargets
      summary: 获取当前完整的签名 Computer target 目录
      description: 新版客户端使用；旧 computer-installation-options 保留 macOS 兼容投影。
      responses:
        '200':
          description: 当前完整安装 target 目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerInstallationTargets'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers/{computerId}/setup-commands:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ComputerId'}
    post:
      tags: [Computers]
      operationId: createComputerSetupCommand
      summary: 生成一条可复制的 Computer 安装命令
      description: |
        仅允许 Server owner/admin。每次成功都会使上一份尚未认领的命令失效；
        Computer 完成认领后不能再次生成。响应不得进入缓存、日志或客户端持久层。
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
      responses:
        '201':
          description: 一次性安装命令
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerSetupCommand'}
        default: {$ref: '#/components/responses/Error'}

  /computer/enrollments:claim:
    post:
      tags: [Computers]
      operationId: claimComputerEnrollment
      summary: 使用安装令牌认领 Computer
      description: |
        客户端本地生成长期 secret，只提交 SHA-256。相同令牌和摘要可恢复同一
        credential route/version；后台从不接收或返回长期 secret 明文。
      security:
        - EnrollmentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerEnrollmentClaimRequest'}
      responses:
        '201':
          description: Computer 已认领或已恢复
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerEnrollmentClaim'}
        default: {$ref: '#/components/responses/Error'}

  /computer/preflight:
    post:
      tags: [Computers]
      operationId: preflightComputer
      summary: 只读检查本机 Computer 身份和自动重新纳管资格
      description: |
        使用当前用户本地保存的长期 Computer credential。空请求只判断当前 Computer
        是否 active 或已 removed；携带 replacement 时同时验证新 enrollment 和本机
        TAT identity，成功时为已 removed Computer 签发短期 replacement grant。
        本操作不签发 Session、不更新 last-seen，也不修改任何业务状态。
      security:
        - ComputerCredentialAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerPreflightRequest'}
      responses:
        '204':
          description: Computer active 且 credential current
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
        '410':
          description: Computer 已 removed，或原 provider identity 已明确销毁
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerPreflightRemoved'}
        default: {$ref: '#/components/responses/Error'}

  /computer/setup-codes:redeem:
    post:
      tags: [Computers]
      operationId: redeemComputerSetupCode
      summary: 将短安装码兑换为一次安装脚本
      description: |
        请求正文只包含 16 位短码；响应是经过固化 release 约束的 POSIX shell。
        可在当前 enrollment 被认领、过期或重新签发前安全重试，响应不得缓存。
      security: []
      parameters:
        - name: X-Vela-Computer-Target
          in: header
          required: false
          description: |
            第一阶段安装 shell 检测出的规范化 target。新版客户端始终发送；省略时仅为兼容
            已发布的 macOS bootstrap，并按 darwin-arm64 处理。
          schema:
            type: string
            enum: [darwin-arm64, linux-amd64]
            default: darwin-arm64
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, minLength: 16, maxLength: 19}
      responses:
        '200':
          description: 第二阶段安装脚本
          headers:
            Cache-Control:
              required: true
              schema: {type: string, enum: [no-store]}
            Pragma:
              required: true
              schema: {type: string, enum: [no-cache]}
          content:
            text/plain:
              schema: {type: string, minLength: 1}
        default: {$ref: '#/components/responses/Error'}

  /computer-artifacts/{version}/{target}/{file}:
    parameters:
      - name: version
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
      - name: target
        in: path
        required: true
        schema: {type: string, enum: [darwin-arm64, linux-amd64]}
      - name: file
        in: path
        required: true
        schema:
          type: string
          enum: [manifest.json, manifest.sig, install.sh, vela-computer]
    get:
      tags: [Computers]
      operationId: getComputerArtifact
      summary: 获取当前安装批次固化的私有制品
      description: |
        校验 Enrollment token 与批次绑定后，返回最长五分钟且不超过 token
        剩余有效期的私有 COS 下载地址。平台不代理对象内容。
      security:
        - EnrollmentAuth: []
      responses:
        '307':
          description: 跳转到短期私有 COS 下载地址
          headers:
            Location:
              required: true
              schema: {type: string, format: uri, x-sensitive: true}
            Cache-Control:
              required: true
              schema: {type: string, enum: [no-store]}
            Pragma:
              required: true
              schema: {type: string, enum: [no-cache]}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers/{computerId}/runtime-credentials:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ComputerId'}
    post:
      tags: [Computers]
      operationId: createComputerRuntimeCredential
      summary: 首次签发或人工恢复 Computer Runtime Credential
      description: |
        仅允许 Server owner/admin。响应只在 60 分钟 KMS 加密交接窗口内按
        Idempotency-Key 重放，不保存可直接使用的明文 Secret。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerRuntimeCredentialRequest'}
      responses:
        '201':
          description: 只返回一次的 Computer Runtime Credential
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerRuntimeCredential'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers/{computerId}/refresh:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ComputerId'}
    post:
      tags: [Computers]
      operationId: refreshComputer
      summary: 立即从 TAT 刷新 Computer 状态
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 已提交查询
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/computers/{computerId}/terminal-sessions:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ComputerId'}
    post:
      tags: [Computers]
      operationId: createTerminalSession
      summary: 调用 TAT StartSession 创建 PTY
      description: 浏览器直接连接腾讯云 TAT；平台不代理或保存终端流。
      responses:
        '201':
          description: 一次性短期 PTY Session
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSession'}
        default: {$ref: '#/components/responses/Error'}

  /computer/session:
    post:
      tags: [Computers]
      operationId: createComputerSession
      summary: 长期 Computer Credential 换取短期平台 Session
      security:
        - ComputerCredentialAuth: []
      parameters:
        - name: X-Vela-Assignment-Version
          in: header
          required: true
          schema:
            type: integer
            enum: [1]
            x-enum-varnames: [CreateComputerSessionParamsXVelaAssignmentVersionN1]
      responses:
        '201':
          description: 15 分钟 Computer Session
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerSession'}
        default: {$ref: '#/components/responses/Error'}

  /computer/credential:rotate:
    post:
      tags: [Computers]
      operationId: rotateComputerCredential
      summary: 轮换当前 Computer Runtime Credential
      security:
        - ComputerBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: 新 Credential；旧版本进入固定 60 分钟 grace
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerRuntimeCredential'}
        default: {$ref: '#/components/responses/Error'}

  /computer/session-v2:
    post:
      tags: [Computers]
      operationId: createComputerSessionV2
      summary: 协商可扩展 Assignment 协议并签发 Computer Session
      security:
        - ComputerCredentialAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerSessionNegotiationRequest'}
      responses:
        '201':
          description: 已选择双方支持的最高 Assignment 版本
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerSessionV2'}
        default: {$ref: '#/components/responses/Error'}

  /computer/assignments:
    get:
      tags: [Computers]
      operationId: getComputerAssignments
      summary: 拉取当前 Computer 的权威 Agent Assignment Snapshot
      security:
        - ComputerBearer: []
      parameters:
        - name: X-Vela-Assignment-Version
          in: header
          required: true
          schema:
            type: integer
            enum: [1]
            x-enum-varnames: [GetComputerAssignmentsParamsXVelaAssignmentVersionN1]
        - name: sinceEpoch
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Id'}
        - name: sinceRevision
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
        - name: waitSeconds
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 25, default: 25}
        - name: forceFull
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 完整 Assignment Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAssignmentSnapshot'}
        '204':
          description: 当前 epoch/revision 没有变化
          headers:
            X-Assignment-Revision:
              required: true
              schema: {type: integer, format: int64, minimum: 1}
        default: {$ref: '#/components/responses/Error'}

  /computer/assignments-v2:
    get:
      tags: [Computers]
      operationId: getComputerAssignmentsV2
      summary: 拉取支持 Agent Profile capability command 的 Assignment v2 Snapshot
      security:
        - ComputerBearer: []
      parameters:
        - name: sinceEpoch
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Id'}
        - name: sinceRevision
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
        - name: waitSeconds
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 25, default: 25}
        - name: forceFull
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 完整 Assignment v2 Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAssignmentSnapshotV2'}
        '204':
          description: 当前 epoch/revision 没有变化
          headers:
            X-Assignment-Revision:
              required: true
              schema: {type: integer, format: int64, minimum: 1}
        default: {$ref: '#/components/responses/Error'}

  /computer/assignments-v3:
    get:
      tags: [Computers]
      operationId: getComputerAssignmentsV3
      summary: 拉取使用可扩展 Runtime selector 的 Assignment v3 Snapshot
      security:
        - ComputerBearer: []
      parameters:
        - name: sinceEpoch
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Id'}
        - name: sinceRevision
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
        - name: waitSeconds
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 25, default: 25}
        - name: forceFull
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 完整 Assignment v3 Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAssignmentSnapshotV3'}
        '204':
          description: 当前 epoch/revision 没有变化
          headers:
            X-Assignment-Revision:
              required: true
              schema: {type: integer, format: int64, minimum: 1}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/launches:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Computers]
      operationId: createComputerAgentLaunch
      summary: 原子分配 Agent Launch Fence 并签发短期 Runtime 与 IM Session
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentLaunchRequest'}
      responses:
        '201':
          description: 已分配新的 Launch Fence
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunch'}
        '200':
          description: 相同 launchId 的幂等重试
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunch'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/launches-v2:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
    post:
      tags: [Computers]
      operationId: createComputerAgentLaunchV2
      summary: 为 Assignment v3 分配 Launch Fence 与可扩展 Runtime Session
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentLaunchRequest'}
      responses:
        '201':
          description: 已分配新的 Launch Fence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunchV2'}
        '200':
          description: 相同 launchId 的幂等重试
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunchV2'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/launches-v2/{launchId}/session:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - name: launchId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    post:
      tags: [Computers]
      operationId: refreshComputerAgentSessionV2
      summary: 为 Assignment v3 的当前 Launch 刷新 Runtime 与 IM Session
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentSessionRefreshRequest'}
      responses:
        '201':
          description: 已刷新短期 Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunchSessionV2'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/launches/{launchId}/session:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - name: launchId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    post:
      tags: [Computers]
      operationId: refreshComputerAgentSession
      summary: 为当前 Launch Fence 刷新短期 Runtime 与 IM Session
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentSessionRefreshRequest'}
      responses:
        '200':
          description: 已刷新当前 Launch 的 Session
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerAgentLaunchSession'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/observations/{observationId}:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - name: observationId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    put:
      tags: [Computers]
      operationId: putComputerAgentObservation
      summary: 幂等提交 Agent launch 的观测状态
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentObservation'}
      responses:
        '200':
          description: 已处理；由 accepted 与 reason 明确表达是否推进当前投影
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerObservationResult'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/profile-capability-results/{operationId}:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/OperationId'}
    put:
      tags: [Computers]
      operationId: putComputerAgentProfileCapabilityResult
      summary: 幂等提交 Agent Profile capability refresh 终态结果
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentProfileCapabilityResult'}
      responses:
        '200':
          description: 已处理；accepted/reason 表达是否推进快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerProfileCapabilitySubmissionResult'}
        default: {$ref: '#/components/responses/Error'}

  /computer/agents/{agentId}/profile-capability-invalidations/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - name: eventId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    put:
      tags: [Computers]
      operationId: putComputerAgentProfileCapabilityInvalidation
      summary: 幂等标记 Agent Profile 本机运行能力可能变化
      description: 该操作只标记 stale，不创建 refresh Operation。
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerAgentProfileCapabilityInvalidation'}
      responses:
        '200':
          description: 已处理；旧 authority context/event sequence 被幂等忽略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComputerProfileCapabilitySubmissionResult'}
        default: {$ref: '#/components/responses/Error'}


  /computer/heartbeat:
    post:
      tags: [Computers]
      operationId: sendComputerHeartbeat
      summary: 更新 Computer 与当前 Agent Host 的在线投影
      security:
        - ComputerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputerHeartbeat'}
      responses:
        '204':
          description: 已接受；旧 generation/attempt/launch 项被幂等忽略
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/tasks:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 列出 Task
      security:
        - HumanBearer: []
      parameters:
        - name: owner
          in: query
          schema: {type: string}
          description: Human 可按 owner Member ID 过滤。
        - name: updatedAfter
          in: query
          schema: {type: string, format: date-time}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Task 列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Tasks]
      operationId: createTask
      summary: 创建 Task
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/tasks/{taskId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/TaskId'}
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 获取 Task
      security:
        - HumanBearer: []
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: 修改 Task
      security:
        - HumanBearer: []
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTaskRequest'}
      responses:
        '200':
          description: Task
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/reminders:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Reminders]
      operationId: listReminders
      summary: 列出 Reminder
      responses:
        '200':
          description: Reminder 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Reminder'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Reminders]
      operationId: createReminder
      summary: 创建 Reminder
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReminderRequest'}
      responses:
        '201':
          description: Reminder
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reminder'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/reminders/{reminderId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/ReminderId'}
    get:
      tags: [Reminders]
      operationId: getReminder
      summary: 获取 Reminder
      responses:
        '200':
          description: Reminder
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reminder'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Reminders]
      operationId: updateReminder
      summary: 修改 Reminder
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateReminderRequest'}
      responses:
        '200':
          description: Reminder
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reminder'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Reminders]
      operationId: cancelReminder
      summary: 取消 Reminder
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: 已取消}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/inbox:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Inbox]
      operationId: listInbox
      summary: 列出当前 Human Member 的待办工作
      description: |
        v1 只投影分配给当前 Human Member 且未终结的 Task；不复制腾讯云 IM
        消息，也不恢复旧版 Agent Delivery Inbox。
      responses:
        '200':
          description: 当前待办列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InboxItem'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/activity:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
    get:
      tags: [Activity]
      operationId: listActivity
      summary: 列出当前业务资源变化投影
      description: |
        v1 返回 Task 与 Reminder 的最新变化状态，不承诺不可变历史；聊天消息、
        Agent thinking、工具轨迹和 token stream 均不进入本接口。
      responses:
        '200':
          description: 当前业务变化列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActivityItem'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminders:
    get:
      tags: [Runtime]
      operationId: listRuntimeReminders
      summary: 列出当前 Agent 的 Reminder
      security:
        - RuntimeBearer: []
      responses:
        '200':
          description: 当前 Agent 的 Reminder 列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RuntimeReminder'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Runtime]
      operationId: createRuntimeReminder
      summary: 为当前 Agent 创建 Reminder
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRuntimeReminderRequest'}
      responses:
        '201':
          description: 已创建的 Reminder
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeReminder'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminders/{reminderId}:
    parameters:
      - {$ref: '#/components/parameters/ReminderId'}
    patch:
      tags: [Runtime]
      operationId: updateRuntimeReminder
      summary: 修改当前 Agent 的 Reminder
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRuntimeReminderRequest'}
      responses:
        '200':
          description: 已更新的 Reminder
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeReminder'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Runtime]
      operationId: cancelRuntimeReminder
      summary: 取消当前 Agent 的 Reminder
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: 已取消}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminders/{reminderId}/snooze:
    parameters:
      - {$ref: '#/components/parameters/ReminderId'}
    post:
      tags: [Runtime]
      operationId: snoozeRuntimeReminder
      summary: 延后当前 Agent 的 Reminder
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/ResourceRevision'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnoozeRuntimeReminderRequest'}
      responses:
        '200':
          description: 已延后的 Reminder
          headers:
            X-Resource-Revision: {$ref: '#/components/headers/ResourceRevision'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeReminder'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminders/{reminderId}/log:
    parameters:
      - {$ref: '#/components/parameters/ReminderId'}
    get:
      tags: [Runtime]
      operationId: listRuntimeReminderLog
      summary: 列出当前 Agent 的 Reminder 触发记录
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Reminder occurrence 列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReminderOccurrencePage'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminder-occurrences:
    get:
      tags: [Runtime]
      operationId: listRuntimeReminderOccurrences
      summary: 列出当前 Agent 未确认的 Reminder occurrence
      description: |
        只返回 Runtime Bearer 所属 Agent 的 due occurrence，按
        (scheduledFireAt,id) 升序排列；cursor 是不透明 continuation token。
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Occurrence 列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReminderOccurrencePage'}
        default: {$ref: '#/components/responses/Error'}

  /runtime/reminder-occurrences/{occurrenceId}/ack:
    parameters:
      - {$ref: '#/components/parameters/OccurrenceId'}
    post:
      tags: [Runtime]
      operationId: acknowledgeRuntimeReminderOccurrence
      summary: 当前 Agent 确认 Reminder occurrence
      description: |
        ack 对 occurrence 本身幂等；相同 Agent 重放时返回首次确认后的结果，
        不允许用重放覆盖 resultCode。
      security:
        - RuntimeBearer: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resultCode: {type: string, nullable: true, maxLength: 64}
      responses:
        '200':
          description: 已确认
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReminderOccurrence'}
        default: {$ref: '#/components/responses/Error'}

  /servers/{serverId}/operations/{operationId}:
    parameters:
      - {$ref: '#/components/parameters/ServerId'}
      - {$ref: '#/components/parameters/OperationId'}
    get:
      tags: [Operations]
      operationId: getOperation
      summary: 查询腾讯云异步操作
      responses:
        '200':
          description: 脱敏操作状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    HumanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RuntimeBearer:
      type: http
      scheme: bearer
      bearerFormat: Runtime JWT
    ComputerBearer:
      type: http
      scheme: bearer
      bearerFormat: Computer JWT
      description: 只接受 kind=computer_access 且已通过 credential currentness 校验的短期 Token。
    ComputerCredentialAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 使用 `ComputerCredential <secret>`，不是 Human、Agent 或 Runtime Token。
    EnrollmentAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 使用短期 `Enrollment <cen1...>` 安装令牌；只允许认领和读取固化制品。

  headers:
    ResourceRevision:
      description: 成功写入后的业务资源 revision；不是 HTTP representation ETag。
      schema: {type: integer, format: int64, minimum: 0}

  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
      x-tdsql-shard-key: server_id
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    DirectConversationId:
      name: directConversationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AgentId:
      name: agentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ComputerId:
      name: computerId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    ResourceRevision:
      name: X-Resource-Revision
      in: header
      required: true
      schema: {type: integer, format: int64, minimum: 0}

  responses:
    Error:
      description: 错误
      headers:
        Retry-After:
          description: 建议客户端重试前等待的秒数或 HTTP 日期，仅在适用时返回。
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:
    Id:
      type: string
      format: uuid
    NullableId:
      type: string
      format: uuid
      nullable: true
    NullableCursor:
      type: string
      nullable: true
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    Revision:
      type: integer
      format: int64
      minimum: 0

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            details: {type: object, nullable: true, additionalProperties: true}

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 8, maxLength: 200}
        displayName: {type: string, minLength: 1, maxLength: 100}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 20}
    AuthResult:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, account]
      properties:
        accessToken: {type: string, readOnly: true, x-sensitive: true}
        refreshToken: {type: string, readOnly: true, x-sensitive: true}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        account: {$ref: '#/components/schemas/Account'}
    Account:
      type: object
      additionalProperties: false
      required: [id, email, displayName, imState, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        email: {type: string, format: email}
        displayName: {type: string}
        imUserId: {type: string, nullable: true}
        imState: {type: string, enum: [provisioning, ready, error]}
        revision: {$ref: '#/components/schemas/Revision'}
    ImSession:
      type: object
      additionalProperties: false
      required: [sdkAppId, userId, userSig, expiresAt]
      properties:
        sdkAppId: {type: integer}
        userId: {type: string}
        userSig: {type: string, readOnly: true, x-sensitive: true}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}

    Server:
      type: object
      additionalProperties: false
      required: [id, slug, name, ownerMemberId, imState, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        slug: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        ownerMemberId: {$ref: '#/components/schemas/Id'}
        imState: {type: string, enum: [provisioning, ready, error]}
        revision: {$ref: '#/components/schemas/Revision'}
    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, nullable: true, maxLength: 1000}
    UpdateServerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, nullable: true, maxLength: 1000}
    AcceptedResource:
      type: object
      additionalProperties: false
      required: [resourceId, operations]
      properties:
        resourceId: {$ref: '#/components/schemas/Id'}
        operations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Operation'}

    Invite:
      type: object
      additionalProperties: false
      required: [id, serverId, role, maxUses, usedCount, expiresAt, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        role: {type: string, enum: [admin, member]}
        maxUses: {type: integer, minimum: 1}
        usedCount: {type: integer, minimum: 0}
        landingChannelId: {$ref: '#/components/schemas/NullableId'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        revision: {$ref: '#/components/schemas/Revision'}
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [role, maxUses, expiresAt]
      properties:
        role: {type: string, enum: [admin, member]}
        maxUses: {type: integer, minimum: 1, maximum: 1000}
        landingChannelId: {$ref: '#/components/schemas/NullableId'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    InviteSecret:
      type: object
      additionalProperties: false
      required: [invite, token]
      properties:
        invite: {$ref: '#/components/schemas/Invite'}
        token: {type: string, readOnly: true, x-sensitive: true}
    AcceptJoinLinkRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 20, writeOnly: true, x-sensitive: true}
    JoinResult:
      type: object
      additionalProperties: false
      required: [serverId, serverSlug, memberId, landingChannelId, operations]
      properties:
        serverId: {$ref: '#/components/schemas/Id'}
        serverSlug: {type: string, minLength: 2, maxLength: 63}
        memberId: {$ref: '#/components/schemas/Id'}
        landingChannelId: {$ref: '#/components/schemas/Id'}
        operations:
          type: array
          items: {$ref: '#/components/schemas/Operation'}
    Member:
      type: object
      additionalProperties: false
      required: [id, serverId, kind, role, displayName, handle, status, imState, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        kind: {type: string, enum: [human, agent]}
        accountId: {$ref: '#/components/schemas/NullableId'}
        role: {type: string, enum: [owner, admin, member]}
        displayName: {type: string}
        handle: {type: string}
        status: {type: string, enum: [active, removing, removed]}
        imUserId: {type: string, nullable: true}
        imState: {type: string, enum: [provisioning, ready, error]}
        revision: {$ref: '#/components/schemas/Revision'}
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: {type: string, enum: [admin, member]}
        displayName: {type: string, minLength: 1, maxLength: 100}

    DirectConversationStatus:
      type: string
      enum: [active, closing, closed]
    DirectConversationIMState:
      type: string
      enum: [provisioning, ready, error, deleted]
    DirectConversation:
      type: object
      additionalProperties: false
      required: [id, serverId, memberA, memberB, status, imGroupId, imState, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        memberA: {$ref: '#/components/schemas/Member'}
        memberB: {$ref: '#/components/schemas/Member'}
        status: {$ref: '#/components/schemas/DirectConversationStatus'}
        imGroupId: {type: string, minLength: 1, maxLength: 255}
        imState: {$ref: '#/components/schemas/DirectConversationIMState'}
        revision: {$ref: '#/components/schemas/Revision'}
    CreateDirectConversationRequest:
      type: object
      additionalProperties: false
      required: [peerMemberId]
      properties:
        peerMemberId: {$ref: '#/components/schemas/Id'}

    Channel:
      type: object
      additionalProperties: false
      required: [id, serverId, name, visibility, joined, imState, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        serverId: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        description: {type: string, nullable: true}
        visibility: {type: string, enum: [public, private]}
        joined:
          type: boolean
          description: 当前 Human 已完成腾讯云 IM 成员同步，可以打开该 Channel 会话。
        systemKey: {type: string, nullable: true, enum: [all]}
        imGroupId: {type: string}
        imTopicId: {type: string, nullable: true}
        imState: {type: string, enum: [provisioning, ready, error]}
        revision: {$ref: '#/components/schemas/Revision'}
    CreateChannelRequest:
      type: object
      additionalProperties: false
      required: [name, visibility]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, nullable: true, maxLength: 1000}
        visibility: {type: string, enum: [public, private]}
    UpdateChannelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, nullable: true, maxLength: 1000}

    RuntimeConfig:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [codex, hermes-acp, hermes-gateway]
        model: {type: string, nullable: true, maxLength: 100}

    RuntimeSelectorV2:
      type: object
      additionalProperties: false
      required: [kind]
