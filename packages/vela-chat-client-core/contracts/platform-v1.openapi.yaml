  account_already_exists: {status: 409}
  token_expired: {status: 401}
  session_revoked: {status: 401}
  im_identity_not_ready: {status: 409}
  im_session_unavailable: {status: 503}
  direct_conversation_closing: {status: 409}
  runtime_credential_invalid: {status: 401}
  runtime_credential_revoked: {status: 401}
  computer_credential_invalid: {status: 401}
  computer_credential_revoked: {status: 401}
  computer_credential_not_current: {status: 409}
  computer_removed: {status: 410}
  computer_provider_identity_gone: {status: 410}
  computer_replacement_identity_mismatch: {status: 409}
  replacement_release_mismatch: {status: 409}
  computer_credential_exists: {status: 409}
