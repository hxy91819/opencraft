title = "OpenCraft secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated OpenAPI digests are SHA256 checksums, not credentials"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)packages/vela-chat-client-core/src/generated/openapi-lock\.ts$''']
regexes = ['''(?:SOURCE|GENERATED)_OPENAPI_SHA256\s*=\s*"[a-f0-9]{64}"''']
